<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory System Connection Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #f0f6fc;
            padding: 40px;
            line-height: 1.6;
        }
        .test-container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(33, 38, 45, 0.8);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid rgba(88, 166, 255, 0.2);
        }
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-weight: 500;
        }
        .success { background: rgba(81, 207, 102, 0.2); border: 1px solid #51cf66; }
        .error { background: rgba(255, 107, 107, 0.2); border: 1px solid #ff6b6b; }
        .info { background: rgba(88, 166, 255, 0.2); border: 1px solid #58a6ff; }
        button {
            background: #58a6ff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover { background: #4a90e2; }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧠 Memory System Connection Test</h1>
        
        <div id="status" class="status info">
            Ready to test connection...
        </div>
        
        <button onclick="testConnection()">Test Backend Connection</button>
        <button onclick="testMemoryLoad()">Test Memory Load</button>
        <button onclick="testCreateEntity()">Test Create Entity</button>
        
        <h3>Test Results:</h3>
        <pre id="results">No tests run yet...</pre>
        
        <h3>Instructions:</h3>
        <ol>
            <li><strong>Start Backend Server:</strong>
                <pre>cd ~/superkraft_memory
node start-system.js</pre>
            </li>
            <li><strong>Open this file in browser</strong></li>
            <li><strong>Click "Test Backend Connection"</strong></li>
        </ol>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';
        
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
        }
        
        function logResult(test, result) {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            results.textContent += `[${timestamp}] ${test}: ${JSON.stringify(result, null, 2)}\n\n`;
        }
        
        async function testConnection() {
            updateStatus('Testing backend connection...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                logResult('Health Check', data);
                updateStatus('✅ Backend connection successful!', 'success');
                
            } catch (error) {
                logResult('Health Check Error', { error: error.message });
                updateStatus('❌ Backend connection failed! Make sure server is running on port 8000', 'error');
            }
        }
        
        async function testMemoryLoad() {
            updateStatus('Testing memory load...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/memory`);
                const data = await response.json();
                
                logResult('Memory Load', { 
                    entityCount: data.entities?.length || 0,
                    relationCount: data.relations?.length || 0,
                    sample: data.entities?.slice(0, 2) || []
                });
                updateStatus(`✅ Loaded ${data.entities?.length || 0} entities successfully!`, 'success');
                
            } catch (error) {
                logResult('Memory Load Error', { error: error.message });
                updateStatus('❌ Failed to load memory data', 'error');
            }
        }
        
        async function testCreateEntity() {
            updateStatus('Testing entity creation...', 'info');
            
            const testEntity = {
                name: `Test_Entity_${Date.now()}`,
                entityType: 'test',
                observations: ['Created by connection test', 'Timestamp: ' + new Date().toISOString()]
            };
            
            try {
                const response = await fetch(`${API_BASE}/memory/entities`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entities: [testEntity] })
                });
                
                const data = await response.json();
                logResult('Create Entity', { entity: testEntity, response: data });
                updateStatus('✅ Entity creation successful!', 'success');
                
            } catch (error) {
                logResult('Create Entity Error', { error: error.message });
                updateStatus('❌ Failed to create entity', 'error');
            }
        }
    </script>
</body>
</html>
